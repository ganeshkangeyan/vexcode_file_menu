[pytest]
# Base URL for the app under test (prod). Override with --base-url on the CLI,
# or run multiple sites at once with --sites/VEX_SITES (see conftest.py).
#
# --browser is deliberately NOT set here. pytest-playwright's own --browser
# flag is additive (action="append"), not a override -- confirmed live
# (2026-08-25): baking "--browser=chromium" in here and then also passing
# "--browser=chromium --browser-channel=msedge" on the CLI ran TWO chromium
# instances (ids "chromium0"/"chromium1") instead of one, and one of them
# crashed on launch. Leaving it unset means pytest-playwright's own default
# (chromium) applies with zero flags, and a single "--browser=firefox" (or
# "--browser=chromium --browser-channel=msedge" for Edge) on the CLI is then
# the only browser that runs -- no duplication.
addopts = --base-url=https://codev5.vex.com/ --strict-markers
testpaths = tests

# One marker per File-menu feature area, so CI/Jenkins can run a subset with
# `pytest -m save_as` etc. instead of the whole suite. --strict-markers above
# means a typo'd -m expression fails loudly instead of silently matching zero
# tests. Applied at module level via `pytestmark = pytest.mark.xxx` in each
# tests/test_*.py file.
markers =
    new_project: File > New Blocks/Text Project
    unsaved_changes: The "Save now?" Discard/Save prompt
    open: File > Open
    open_recent: File > Open Recent
    open_examples: File > Open Examples
    save: File > Save (direct, on a never-saved project)
    save_as: File > Save As
    whats_new: File > What's New
    about: File > About (incl. Privacy Policy / Acknowledgements)
